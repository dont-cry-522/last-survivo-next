<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>林地远征 · Last Survivor Next</title>
    <link rel="stylesheet" href="style.css?v=forest31">

<body>
    <div id="game-container">
        <div class="game-header">LAST SURVIVOR NEXT · 林地远征 <a href="gallery.html">角色图鉴 ↗</a></div>
        <canvas id="gameCanvas"></canvas>
        <div class="game-footer">WASD 移动 | Shift 翻滚 / 瞬移 | ESC 暂停 | R 重开 | M 静音</div>
    </div>

    <div id="opening-objective" hidden></div><aside id="forest-map" hidden aria-label="森林区域地图"><strong>中央营地</strong><canvas width="160" height="90" aria-label="营地居中，密林在南北，湿地在东，遗迹在西；亮点为你的位置" role="img"></canvas><small>5120 × 2880 · 有限地图</small><small class="ruins-status">遗迹宝箱 · 靠近挑战</small></aside>
    <div id="mobile-controls" aria-label="触屏游戏操作">
        <div class="mobile-toolbar">
            <a class="mobile-gallery" href="gallery.html">图鉴</a>
            <button id="mobile-action" type="button">开始游戏</button>
            <button id="mobile-restart" type="button">重开</button>
            <button id="mobile-mute" type="button" aria-pressed="false">静音</button>
        </div>
        <div id="joystick" role="group" aria-label="拖动摇杆移动"><span id="joystick-knob"></span><span class="joystick-label">移动</span></div>
        <span class="mobile-tip">自动攻击 · 横屏体验更佳</span>
        <button id="mobile-dash" type="button">冲刺</button>
    </div>
